<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff4f9a;
    --gold: #ffd166;
    --purple: #7b2ff7;
    --bg1: #1a0933;
    --bg2: #3b0f5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Poppins', sans-serif;
    color: #fff;
    background: radial-gradient(ellipse at top, var(--bg2), var(--bg1) 70%);
    overflow: hidden;
  }
  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; text-align: center;
    transition: opacity .8s ease, transform .8s ease;
  }
  .hidden { opacity: 0; pointer-events: none; transform: scale(1.05); }
  button {
    font-family: inherit; cursor: pointer; border: none;
    border-radius: 999px; padding: 14px 32px; font-size: 1.1rem; font-weight: 600;
    color: #fff; background: linear-gradient(135deg, var(--pink), var(--purple));
    box-shadow: 0 8px 24px rgba(255, 79, 154, .4);
    transition: transform .2s, box-shadow .2s;
  }
  button:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 12px 30px rgba(255, 79, 154, .6); }
  button:disabled { opacity: .4; cursor: not-allowed; transform: none; }

  /* ---------- Upload screen ---------- */
  #setup h1 { font-family: 'Dancing Script', cursive; font-size: clamp(2.2rem, 7vw, 3.6rem); color: var(--gold); }
  #setup p { opacity: .8; margin: 8px 0 20px; max-width: 520px; }
  .drop {
    width: min(640px, 100%); border: 2px dashed rgba(255,255,255,.4); border-radius: 20px;
    padding: 24px; background: rgba(255,255,255,.05); cursor: pointer; transition: background .2s, border-color .2s;
  }
  .drop.over { background: rgba(255,79,154,.15); border-color: var(--pink); }
  .thumbs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 16px; }
  .thumbs div {
    aspect-ratio: 1; border-radius: 10px; background: rgba(255,255,255,.08) center/cover no-repeat;
    display: flex; align-items: center; justify-content: center; font-size: .8rem; opacity: .9;
  }
  #setup .count { margin: 16px 0; font-weight: 600; }

  /* ---------- Gift screen ---------- */
  .gift { font-size: clamp(6rem, 22vw, 10rem); animation: wobble 1.6s ease-in-out infinite; cursor: pointer; filter: drop-shadow(0 10px 30px rgba(255,209,102,.5)); user-select: none; }
  @keyframes wobble { 0%,100% { transform: rotate(0) scale(1); } 25% { transform: rotate(-8deg) scale(1.05); } 75% { transform: rotate(8deg) scale(1.05); } }
  #gift h2 { font-family: 'Dancing Script', cursive; font-size: clamp(2rem, 6vw, 3rem); color: var(--gold); margin-top: 10px; }
  #gift p { opacity: .8; margin: 6px 0 24px; }

  /* ---------- Main celebration ---------- */
  #main { z-index: 5; justify-content: flex-start; padding-top: 3vh; gap: 2vh; }
  .title {
    font-family: 'Dancing Script', cursive; font-size: clamp(2.2rem, 7vw, 4.4rem); line-height: 1.15;
    color: var(--gold); text-shadow: 0 0 18px rgba(255,79,154,.8), 0 4px 0 rgba(0,0,0,.25);
  }
  .title span { display: inline-block; animation: bounce 1.6s ease-in-out infinite, glow 4s linear infinite; }
  @keyframes glow { 0%,100% { color: var(--gold); } 33% { color: #ff8fc4; } 66% { color: #a9d6ff; } }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

  .stage {
    position: relative; flex-shrink: 0;
    width: min(520px, 92vw, 48vh); aspect-ratio: 4/5;
    perspective: 1200px;
  }
  .slide {
    position: absolute; inset: 0; border-radius: 18px; overflow: hidden;
    border: 6px solid #fff; box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 40px rgba(255,79,154,.35);
    opacity: 0; transition: opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.8,.2,1);
    background: #000;
  }
  .slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slide.active { opacity: 1; transform: none !important; z-index: 2; }
  .slide.active img { animation: kenburns 6s ease-out forwards; }
  .slide.fx-zoom   { transform: scale(.3) rotate(-15deg); }
  .slide.fx-left   { transform: translateX(-120%) rotate(-10deg); }
  .slide.fx-right  { transform: translateX(120%) rotate(10deg); }
  .slide.fx-flip   { transform: rotateY(90deg); }
  .slide.fx-drop   { transform: translateY(-120%) scale(.8); }
  .slide.fx-spin   { transform: rotate(180deg) scale(.2); }
  @keyframes kenburns { from { transform: scale(1.18) translate(2%, 2%); } to { transform: scale(1) translate(0,0); } }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 16px 14px;
    background: linear-gradient(transparent, rgba(0,0,0,.7)); font-family: 'Dancing Script', cursive; font-size: 1.6rem;
  }
  .dots { display: flex; gap: 8px; justify-content: center; position: relative; z-index: 5; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.3); transition: all .3s; cursor: pointer; }
  .dots i.on { background: var(--pink); width: 26px; border-radius: 6px; }
  .wish {
    max-width: 640px; font-size: clamp(.95rem, 2.6vw, 1.1rem); line-height: 1.6; white-space: pre-line;
    position: relative; z-index: 5; padding: 18px 22px 40px; margin-bottom: 24px;
    background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.15); border-radius: 16px; backdrop-filter: blur(4px);
  }
  .wish:empty { display: none; }
  /* celebration screen scrolls as a normal page (works with phone touch scrolling) */
  #main { position: relative; inset: auto; min-height: 100vh; min-height: 100dvh; }
  #main.hidden { display: none; }
  body.scroll { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
  html:has(body.scroll) { overflow-x: hidden; }
  .title .word { animation: none; white-space: nowrap; }

  /* floating polaroids in background */
  .floater {
    position: fixed; z-index: 1; width: clamp(70px, 12vw, 130px); padding: 6px 6px 22px; background: #fff;
    border-radius: 4px; box-shadow: 0 10px 25px rgba(0,0,0,.5); opacity: .55; pointer-events: none;
    animation: floatUp linear infinite;
  }
  .floater img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  @keyframes floatUp {
    from { transform: translateY(110vh) rotate(var(--r1)); }
    to   { transform: translateY(-40vh) rotate(var(--r2)); }
  }

  .balloon { position: fixed; bottom: -120px; z-index: 0; font-size: clamp(2.5rem, 6vw, 4rem); animation: rise linear infinite; pointer-events: none; }
  @keyframes rise {
    0% { transform: translateY(0) translateX(0); }
    50% { transform: translateY(-60vh) translateX(30px); }
    100% { transform: translateY(-130vh) translateX(-20px); }
  }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 20; }

  .controls { position: fixed; top: 12px; right: 12px; z-index: 30; display: flex; gap: 8px; }
  .controls button { padding: 10px 14px; font-size: 1.1rem; box-shadow: none; background: rgba(255,255,255,.15); backdrop-filter: blur(6px); }

  @media (max-width: 600px) { #main { padding-top: 60px; } }
  @media (max-width: 480px) {
    .thumbs { grid-template-columns: repeat(5, 1fr); gap: 5px; }
    .caption { font-size: 1.25rem; }
  }
</style>
</head>
<body>

<!-- ===================== 1. UPLOAD SCREEN ===================== -->
<section id="setup" class="screen hidden">
  <h1>Create the Surprise 🎂</h1>
  <p>Choose up to 10 photos. They'll fly, zoom and spin in a slideshow with Happy Birthday music.</p>
  <label class="drop" id="drop">
    <input type="file" id="fileInput" accept="image/*" multiple hidden>
    <div>📷 <b>Click to choose photos</b> or drag &amp; drop them here</div>
    <div class="thumbs" id="thumbs"></div>
  </label>
  <div class="count" id="count">0 / 10 photos</div>
  <button id="startBtn" disabled>🎁 Start the Surprise</button>
</section>

<!-- ===================== 2. GIFT SCREEN ===================== -->
<section id="gift" class="screen hidden">
  <div class="gift" id="giftBox">🎁</div>
  <h2>A little surprise for you…</h2>
  <p>Turn your sound on 🔊 and tap the gift</p>
  <button id="openBtn">Open it!</button>
</section>

<!-- ===================== 3. CELEBRATION ===================== -->
<section id="main" class="screen hidden">
  <h1 class="title" id="title"></h1>
  <div class="stage" id="stage"></div>
  <div class="dots" id="dots"></div>
  <p class="wish" id="wish"></p>
</section>

<canvas id="confetti"></canvas>

<div class="controls" id="controls" style="display:none">
  <button id="muteBtn" title="Music on/off">🔊</button>
  <button id="editBtn" title="Change photos">📷</button>
</div>

<script>
/* =========================================================
   ✏️  EDIT THESE SETTINGS
   ========================================================= */
const CONFIG = {
  name: "My Love",                 // birthday person's name
  message: `Happy Birthday, my love! ❤️

You always look amazing to me, and you will always be special in my eyes. May you live a long, beautiful life filled with endless happiness, success, and prosperity. I love you more than words can express. You are my most invaluable asset, and I feel truly blessed to have you in my life.

Wishing you all the love, joy, and happiness your heart deserves. ❤️`,

  // Photos for the HOSTED version: put files in a "photos" folder next to this file.
  // Name them 1, 2, 3 ... 10 — any of .jpg .jpeg .png .webp works. Missing ones are skipped.
  // If none are found, the upload screen shows.
  photoFolder: "photos",
  captions: [],                    // optional, e.g. ["Our first trip", "Best day ever", ...]

  music: "music.mp3",              // your song next to this file. If it's missing, the built-in Happy Birthday tune plays
  slideSeconds: 4.5                // time each photo stays on screen
};
/* ========================================================= */

const MAX = 10;
const $ = id => document.getElementById(id);
let photos = [];
let slideTimer = null;

/* ---------------- Screen helpers ---------------- */
function show(id) {
  ["setup", "gift", "main"].forEach(s => $(s).classList.toggle("hidden", s !== id));
  document.body.classList.toggle("scroll", id === "main");
  window.scrollTo(0, 0);
}

/* ---------------- Load photos from folder ---------------- */
function tryLoad(src) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => res(src);
    img.onerror = () => res(null);
    img.src = src;
  });
}

const EXTS = ["jpg", "jpeg", "png", "webp", "JPG", "JPEG", "PNG", "WEBP"];
async function findPhoto(n) {
  for (const ext of EXTS) {
    const src = await tryLoad(`${CONFIG.photoFolder}/${n}.${ext}`);
    if (src) return src;
  }
  return null;
}

(async function init() {
  const nums = Array.from({ length: MAX }, (_, i) => i + 1);
  const found = (await Promise.all(nums.map(findPhoto))).filter(Boolean);
  if (found.length) { photos = found.slice(0, MAX); show("gift"); }
  else show("setup");
})();

/* ---------------- Upload screen ---------------- */
const drop = $("drop"), fileInput = $("fileInput");
renderThumbs([]);

function renderThumbs(list) {
  const t = $("thumbs"); t.innerHTML = "";
  for (let i = 0; i < MAX; i++) {
    const d = document.createElement("div");
    if (list[i]) d.style.backgroundImage = `url(${list[i]})`; else d.textContent = i + 1;
    t.appendChild(d);
  }
  $("count").textContent = `${list.length} / ${MAX} photos`;
  $("startBtn").disabled = list.length === 0;
}

function addFiles(files) {
  const imgs = [...files].filter(f => f.type.startsWith("image/"));
  photos.forEach(u => u.startsWith("blob:") && URL.revokeObjectURL(u));
  photos = imgs.slice(0, MAX).map(f => URL.createObjectURL(f));
  if (imgs.length > MAX) alert(`Only the first ${MAX} photos were used.`);
  renderThumbs(photos);
}

fileInput.addEventListener("change", e => addFiles(e.target.files));
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => addFiles(e.dataTransfer.files));

$("startBtn").onclick = celebrate;
$("openBtn").onclick = celebrate;
$("giftBox").onclick = celebrate;
$("editBtn").onclick = () => { clearInterval(slideTimer); Music.stop(); $("controls").style.display = "none"; renderThumbs(photos); show("setup"); };

/* ---------------- Celebration ---------------- */
function celebrate() {
  show("main");
  $("controls").style.display = "flex";
  Music.start();
  buildTitle();
  buildSlides();
  buildFloaters();
  buildBalloons();
  typeWish();
  burstConfetti(250);
  setTimeout(() => burstConfetti(150), 1500);
}

function buildTitle() {
  const text = `Happy Birthday, ${CONFIG.name}!`;
  let i = 0;
  $("title").innerHTML = text.split(" ").map(word =>
    `<span class="word">` + [...word].map(ch =>
      `<span style="animation-delay:${(i++) * 0.07}s">${ch}</span>`).join("") + `</span>`).join(" ");
}

const EFFECTS = ["fx-zoom", "fx-left", "fx-right", "fx-flip", "fx-drop", "fx-spin"];

function buildSlides() {
  const stage = $("stage"), dots = $("dots");
  stage.innerHTML = ""; dots.innerHTML = "";
  photos.forEach((src, i) => {
    const s = document.createElement("div");
    s.className = "slide " + EFFECTS[i % EFFECTS.length];
    s.innerHTML = `<img src="${src}" alt="Photo ${i + 1}">` +
      (CONFIG.captions[i] ? `<div class="caption">${CONFIG.captions[i]}</div>` : "");
    stage.appendChild(s);
    const d = document.createElement("i");
    d.onclick = () => go(i);
    dots.appendChild(d);
  });
  let cur = -1;
  function go(n) {
    const slides = stage.children, dotEls = dots.children;
    if (cur >= 0) {
      slides[cur].classList.remove("active");
      // give the old slide a new random exit/entry effect
      slides[cur].classList.remove(...EFFECTS);
      slides[cur].classList.add(EFFECTS[Math.floor(Math.random() * EFFECTS.length)]);
      dotEls[cur].classList.remove("on");
    }
    cur = n;
    slides[cur].classList.add("active");
    dotEls[cur].classList.add("on");
    clearInterval(slideTimer);
    slideTimer = setInterval(() => go((cur + 1) % photos.length), CONFIG.slideSeconds * 1000);
    if (n === 0 && photos.length > 1) burstConfetti(60);
  }
  go(0);
}

function buildFloaters() {
  document.querySelectorAll(".floater").forEach(f => f.remove());
  const n = Math.min(8, photos.length * 2);
  for (let i = 0; i < n; i++) {
    const f = document.createElement("div");
    f.className = "floater";
    f.innerHTML = `<img src="${photos[i % photos.length]}" alt="">`;
    f.style.left = (Math.random() * 90) + "vw";
    f.style.setProperty("--r1", (Math.random() * 40 - 20) + "deg");
    f.style.setProperty("--r2", (Math.random() * 40 - 20) + "deg");
    f.style.animationDuration = (14 + Math.random() * 12) + "s";
    f.style.animationDelay = (-Math.random() * 20) + "s";
    document.body.appendChild(f);
  }
}

function buildBalloons() {
  document.querySelectorAll(".balloon").forEach(b => b.remove());
  const icons = ["🎈", "🎈", "🎈", "🎉", "💖", "⭐", "🎂"];
  for (let i = 0; i < 12; i++) {
    const b = document.createElement("div");
    b.className = "balloon";
    b.textContent = icons[i % icons.length];
    b.style.left = (Math.random() * 95) + "vw";
    b.style.animationDuration = (9 + Math.random() * 8) + "s";
    b.style.animationDelay = (Math.random() * 10) + "s";
    document.body.appendChild(b);
  }
}

function typeWish() {
  const el = $("wish"), text = CONFIG.message; let i = 0;
  el.textContent = "";
  (function step() { if (i <= text.length) { el.textContent = text.slice(0, i++); setTimeout(step, 35); } })();
}

/* ---------------- Confetti ---------------- */
const cv = $("confetti"), ctx = cv.getContext("2d");
let pieces = [];
function resize() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener("resize", resize); resize();
const COLORS = ["#ff4f9a", "#ffd166", "#7b2ff7", "#06d6a0", "#8ec5ff", "#ffffff"];
function burstConfetti(n) {
  for (let i = 0; i < n; i++) pieces.push({
    x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight / 3,
    vx: (Math.random() - .5) * 16, vy: Math.random() * -14 - 4,
    w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
    r: Math.random() * 6, vr: (Math.random() - .5) * .3,
    c: COLORS[Math.floor(Math.random() * COLORS.length)], life: 0
  });
}
(function loop() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  pieces = pieces.filter(p => p.y < cv.height + 20 && p.life < 600);
  for (const p of pieces) {
    p.vy += .25; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.life * .1)));
    ctx.restore();
  }
  requestAnimationFrame(loop);
})();

/* ---------------- Music ----------------
   Built-in "Happy Birthday" melody (public domain) played as a music box
   with the Web Audio API — no audio file needed. Or set CONFIG.music. */
const Music = (() => {
  let ac, master, playing = false, muted = false, timer, nextLoop = 0, audioEl;
  const BEAT = 0.42; // seconds per beat
  const N = { F2: 87.31, G2: 98.0, C3: 130.81, G4: 392.0, A4: 440.0, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99 };
  // [startBeat, note, beats]
  const melody = [
    [0, "G4", .75], [.75, "G4", .25], [1, "A4", 1], [2, "G4", 1], [3, "C5", 1], [4, "B4", 2],
    [6, "G4", .75], [6.75, "G4", .25], [7, "A4", 1], [8, "G4", 1], [9, "D5", 1], [10, "C5", 2],
    [12, "G4", .75], [12.75, "G4", .25], [13, "G5", 1], [14, "E5", 1], [15, "C5", 1], [16, "B4", 1], [17, "A4", 2],
    [19, "F5", .75], [19.75, "F5", .25], [20, "E5", 1], [21, "C5", 1], [22, "D5", 1], [23, "C5", 3]
  ];
  const bass = [[1, "C3", 3], [4, "G2", 2], [7, "G2", 3], [10, "C3", 2], [13, "C3", 3], [16, "F2", 3], [20, "C3", 2], [22, "G2", 1], [23, "C3", 3]];
  const LOOP_BEATS = 28;

  function tone(freq, t, dur, vol, type) {
    const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    o2.type = "sine"; o2.frequency.value = freq * 2; // bell-like overtone
    const g2 = ac.createGain(); g2.gain.value = .25;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + .015);
    g.gain.exponentialRampToValueAtTime(.001, t + Math.max(dur, .3) + .4);
    o.start(t); o2.start(t); o.stop(t + dur + .5); o2.stop(t + dur + .5);
  }
  function scheduleLoop(start) {
    melody.forEach(([b, n, d]) => tone(N[n], start + b * BEAT, d * BEAT, .32, "triangle"));
    bass.forEach(([b, n, d]) => tone(N[n], start + b * BEAT, d * BEAT, .18, "sine"));
  }
  function tick() {
    // keep scheduling a loop ahead
    while (nextLoop < ac.currentTime + 2) { scheduleLoop(nextLoop); nextLoop += LOOP_BEATS * BEAT; }
  }
  return {
    start() {
      if (playing) return;
      playing = true;
      // create the AudioContext now, inside the tap, so the fallback tune is allowed to play
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (CONFIG.music && !this.fileFailed) {
        if (!audioEl) {
          audioEl = Object.assign(new Audio(CONFIG.music), { loop: true, preload: "auto" });
          audioEl.addEventListener("error", () => this.fallback());
        }
        audioEl.muted = muted;
        audioEl.play().catch(err => { if (err.name !== "AbortError") this.fallback(); });
        return;
      }
      this.synth();
    },
    fallback() {
      if (this.fileFailed || !playing) return;
      console.warn("Could not play " + CONFIG.music + " — using built-in tune");
      this.fileFailed = true;
      if (audioEl) audioEl.pause();
      audioEl = null;
      this.synth();
    },
    synth() {
      ac.resume();
      master = ac.createGain(); master.gain.value = muted ? 0 : .6; master.connect(ac.destination);
      nextLoop = ac.currentTime + .1;
      tick(); timer = setInterval(tick, 500);
    },
    stop() {
      playing = false; clearInterval(timer);
      if (audioEl) audioEl.pause();
      if (master) { master.disconnect(); master = null; }
    },
    toggle() {
      muted = !muted;
      if (audioEl) audioEl.muted = muted;
      if (master) master.gain.value = muted ? 0 : .6;
      return muted;
    }
  };
})();

$("muteBtn").onclick = () => { $("muteBtn").textContent = Music.toggle() ? "🔇" : "🔊"; };
</script>
</body>
</html>
